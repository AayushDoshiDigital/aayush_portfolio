- name: portfolio
  label: 🖼️ Portfolio (logos & screenshots)
  files:
  - name: portfolio
    label: Portfolio page
    file: src/_data/portfolio.json
    fields:
    - name: sections
      label: Portfolio sections (keep the order)
      widget: list
      fields:
      - name: id
        label: Section ID (do not change)
        widget: string
        required: false
      - name: label
        label: Small label
        widget: string
        required: false
      - name: title
        label: Heading
        widget: string
        required: false
      - name: subtitle
        label: Subheading
        widget: string
        required: false
      - name: text
        label: Intro text
        widget: text
        required: false
      - name: clients_label
        label: Hover bar label
        widget: string
        required: false
      - name: layout
        label: Screenshot layout ("s5" = tall phone-style frames, empty = normal)
        widget: string
        required: false
      - name: clients
        label: Clients
        widget: list
        fields:
        - name: name
          label: Client name
          widget: string
          required: false
        - name: initials
          label: Initials (shown if no logo)
          widget: string
          required: false
        - name: logo
          label: Logo
          widget: image
          required: false
        required: false
        summary: '{{fields.name}}'
      - name: screenshots
        label: Screenshots
        widget: list
        fields:
        - name: image
          label: Screenshot
          widget: image
          required: false
        - name: caption
          label: Caption
          widget: string
          required: false
        required: false
        summary: '{{fields.caption}}'
      required: false
      summary: '{{fields.title}}'
