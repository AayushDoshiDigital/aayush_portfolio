backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/YOUR-REPO-NAME
  branch: main
local_backend: true
media_folder: src/images/uploads
public_folder: /images/uploads
site_url: https://YOUR-SITE.netlify.app
locale: en
collections:
- name: blog
  label: 📝 Blog posts
  label_singular: Blog post
  folder: src/blog
  create: true
  extension: md
  format: frontmatter
  slug: '{{slug}}'
  summary: '{{title}} ({{date}})'
  sortable_fields:
  - date
  - title
  fields:
  - name: title
    label: Title
    widget: string
    required: true
  - name: description
    label: Meta description (also shown on blog cards)
    widget: text
    required: false
  - name: date
    label: Publish date
    widget: datetime
    date_format: YYYY-MM-DD
    time_format: false
    format: YYYY-MM-DD
  - name: draft
    label: Draft (hide from website)
    widget: boolean
    default: false
    required: false
  - name: image
    label: Featured image
    widget: image
    required: false
  - name: image_alt
    label: Image description (alt text)
    widget: string
    required: false
  - name: related
    label: Related pages / internal links
    widget: list
    fields: &id003
    - &id001
      name: label
      label: Label
      widget: string
      required: false
    - &id002
      name: url
      label: Link (e.g. /about.html)
      widget: string
      required: false
    required: false
    summary: '{{fields.label}}'
  - name: body
    label: Article
    widget: markdown
- name: pages
  label: 📄 Pages (SEO & content)
  files:
  - name: home
    label: Home
    file: src/_data/pc/home.json
    fields:
    - name: meta_title
      label: SEO title (shown in Google)
      widget: string
      required: false
    - name: meta_description
      label: Meta description (shown in Google)
      widget: text
      required: false
    - name: hero_label
      label: Top label (small text)
      widget: string
      required: false
    - name: hero_heading
      label: Main heading (use <em>word</em> for yellow words)
      widget: string
      required: false
    - name: hero_text
      label: Intro text
      widget: text
      required: false
    - name: hero_button
      label: Button text
      widget: string
      required: false
    - name: sections
      label: Section headings (keep the same order as on the page; edit text only)
      widget: list
      fields:
      - name: label
        label: Small label
        widget: string
        required: false
      - name: heading
        label: Heading
        widget: string
        required: false
      - name: subheading
        label: Subheading
        widget: string
        required: false
      - name: text
        label: Intro text
        widget: text
        required: false
      required: false
      summary: '{{fields.heading}} {{fields.label}}'
  - name: about
    label: About Me
